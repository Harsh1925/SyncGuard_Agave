name: Checks
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: syncguard, POSTGRES_PASSWORD: syncguard, POSTGRES_DB: syncguard_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U syncguard -d syncguard_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://syncguard:syncguard@localhost:5432/syncguard_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
