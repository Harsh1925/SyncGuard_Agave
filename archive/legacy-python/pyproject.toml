[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syncguard"
version = "0.1.0"
description = "Fault-tolerant ERP to PM invoice replication — specification scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
syncguard = "syncguard.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["syncguard*", "simulators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs a disposable PostgreSQL database", "acceptance: requires running local services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Ruff's formatter owns wrapping; SQL statement literals may exceed the preferred width.
ignore = ["E501"]
