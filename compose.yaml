x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql://syncguard:syncguard@postgres:5432/syncguard
    REDIS_URL: redis://redis:6379
    PM_URL: http://pm:8002
    HOST: 0.0.0.0
    LEASE_SECONDS: 10
  restart: unless-stopped
  logging:
    options: { max-size: 10m, max-file: '3' }
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: syncguard, POSTGRES_PASSWORD: syncguard, POSTGRES_DB: syncguard }
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U syncguard -d syncguard'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 2s, timeout: 3s, retries: 30 }
  init:
    <<: *app
    restart: 'no'
    command: ['./node_modules/.bin/tsx', 'apps/backend/src/cli.ts', 'bootstrap']
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      { init: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  erp:
    <<: *app
    command: ['./node_modules/.bin/tsx', 'apps/backend/src/cli.ts', 'erp']
    ports: ['127.0.0.1:8001:8001']
    depends_on: { init: { condition: service_completed_successfully } }
  pm:
    <<: *app
    command: ['./node_modules/.bin/tsx', 'apps/backend/src/cli.ts', 'pm']
    ports: ['127.0.0.1:8002:8002']
    depends_on:
      { init: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  worker:
    <<: *app
    command: ['./node_modules/.bin/tsx', 'apps/backend/src/cli.ts', 'worker']
    depends_on:
      {
        init: { condition: service_completed_successfully },
        pm: { condition: service_started },
        redis: { condition: service_healthy },
      }
  poller:
    <<: *app
    command: ['./node_modules/.bin/tsx', 'apps/backend/src/cli.ts', 'poll-loop']
    depends_on:
      { init: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  dashboard:
    build: { context: ., dockerfile: apps/dashboard/Dockerfile }
    ports: ['127.0.0.1:8080:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
